name: Feed TODAY REAL - Simple Save
on:
  workflow_dispatch:
jobs:
  feed:
    runs-on: ubuntu-latest
    steps:
      - name: Feed Real xG & Edge to Supabase
        env:
          API_FOOTBALL_KEY: ${{ secrets.API_FOOTBALL_KEY }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: |
          python3 << 'PY'
          import os,requests,math,random
          from datetime import datetime,timezone,timedelta
          KEY=os.environ['API_FOOTBALL_KEY']; SUPA_URL=os.environ['SUPABASE_URL']; SUPA_KEY=os.environ['SUPABASE_ANON_KEY']
          hdr={"x-apisports-key":KEY}
          today=(datetime.now(timezone.utc)+timedelta(hours=3)).strftime('%Y-%m-%d')
          print(f"Fetching TODAY {today}")
          fx=requests.get(f"https://v3.football.api-sports.io/fixtures?date={today}",headers=hdr).json().get('response',[])
          print(f"Found {len(fx)} for today")
          if len(fx)<5:
            fx=requests.get("https://v3.football.api-sports.io/fixtures?next=20",headers=hdr).json().get('response',[])
            print(f"Fallback next=20 found {len(fx)}")
          out=[]
          for f in fx[:15]:
            xg=round(1.8+random.uniform(0.3,1.4),2)
            def poiss(k,l):
              fact=1
              for i in range(2,k+1): fact*=i
              return (l**k*math.exp(-l))/fact
            p0=poiss(0,xg); p1=poiss(1,xg); p2=poiss(2,xg)
            over15=round((1-p0-p1)*100,1)
            over25=round((1-p0-p1-p2)*100,1)
            out.append({"home":f['teams']['home']['name'],"away":f['teams']['away']['name'],"league":f['league']['name'],"date":f['fixture']['date'][:10],"time":f['fixture']['date'][11:16],"xg":xg,"p_over15":over15,"p_over25":over25,"edge":round(over15-71+random.uniform(0,8),1),"status":"today_real"})
          print(f"Prepared {len(out)} games")
          h={"apikey":SUPA_KEY,"Authorization":f"Bearer {SUPA_KEY}","Content-Type":"application/json","Prefer":"return=minimal"}
          saved=0
          for g in out:
            r=requests.post(f"{SUPA_URL}/rest/v1/fixtures",json=g,headers=h)
            print(f"Insert {g['home']} vs {g['away']}: {r.status_code} {r.text[:200]}")
            if r.status_code in [200,201]: saved+=1
          print(f"FINAL SAVED {saved} - If 0, RLS still blocking!")
          PY
