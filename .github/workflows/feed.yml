name: Feed TODAY Final - 15 Games
on:
  schedule:
    - cron: '0 5 * * *'
  workflow_dispatch:
jobs:
  feed:
    runs-on: ubuntu-latest
    steps:
      - name: Feed Real xG & Edge to Supabase
        env:
          API_FOOTBALL_KEY: ${{ secrets.API_FOOTBALL_KEY }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: |
          python3 << 'PY'
          import os,requests,math
          from datetime import datetime,timezone,timedelta
          KEY=os.environ['API_FOOTBALL_KEY']; SUPA_URL=os.environ['SUPABASE_URL']; SUPA_KEY=os.environ['SUPABASE_ANON_KEY']
          hdr={"x-apisports-key":KEY}
          today=(datetime.now(timezone.utc)+timedelta(hours=3)).strftime('%Y-%m-%d')
          url=f"https://v3.football.api-sports.io/fixtures?date={today}"
          fx=requests.get(url,headers=hdr).json().get('response',[])
          print(f"TODAY {today}: Found {len(fx)} games")
          if len(fx)<5:
            fx=requests.get("https://v3.football.api-sports.io/fixtures?next=30",headers=hdr).json().get('response',[])
            print(f"Fallback next 30: Found {len(fx)}")
          # Keep popular leagues only for clean ACCA
          top_ids=[39,140,135,78,61,271,203] # PL, LaLiga, SerieA, Bundesliga, Ligue1, Kenya, Turkey
          # If no top leagues today, use whatever
          filtered=[f for f in fx if f['league']['id'] in top_ids]
          if len(filtered)>=5: fx=filtered
          print(f"After filter: {len(fx)} games")
          def avg(team_id):
            try:
              rr=requests.get(f"https://v3.football.api-sports.io/fixtures?team={team_id}&last=5",headers=hdr).json().get('response',[])
              if not rr: return 1.2,1.1
              gs=sum([(g['goals']['home'] if g['teams']['home']['id']==team_id else g['goals']['away']) or 0 for g in rr])/max(1,len(rr))
              gc=sum([(g['goals']['away'] if g['teams']['home']['id']==team_id else g['goals']['home']) or 0 for g in rr])/max(1,len(rr))
              return gs,gc
            except: return 1.2,1.1
          out=[]
          for f in fx[:15]:
            hid=f['teams']['home']['id']; aid=f['teams']['away']['id']
            hs,hc=avg(hid); aw_s,aw_c=avg(aid)
            xg=round((hs+aw_c)/2+0.3,2)
            def poiss(k,l):
              fact=1
              for i in range(2,k+1): fact*=i
              return (l**k*math.exp(-l))/fact
            p0=poiss(0,xg); p1=poiss(1,xg); p2=poiss(2,xg)
            over15=round((1-p0-p1)*100,1); over25=round((1-p0-p1-p2)*100,1)
            out.append({"home":f['teams']['home']['name'],"away":f['teams']['away']['name'],"league":f['league']['name'],"date":f['fixture']['date'][:10],"time":f['fixture']['date'][11:16],"xg":xg,"p_over15":over15,"p_over25":over25,"edge":round(over15-72,1),"status":"today_final"})
          # Clear old demo
          h={"apikey":SUPA_KEY,"Authorization":f"Bearer {SUPA_KEY}","Content-Type":"application/json"}
          requests.delete(f"{SUPA_URL}/rest/v1/fixtures?date=lt.{today}",headers=h)
          hh={**h,"Prefer":"return=minimal"}
          saved=0
          for g in out:
            r=requests.post(f"{SUPA_URL}/rest/v1/fixtures",json=g,headers=hh)
            if r.status_code in [200,201]: saved+=1
          print(f"SAVED {saved} TODAY games to Supabase - REAL MODE ON")
          PY
