name: Feed TODAY Debug
on:
  workflow_dispatch:
jobs:
  feed:
    runs-on: ubuntu-latest
    steps:
      - name: Feed Real xG & Edge to Supabase
        env:
          API_FOOTBALL_KEY: ${{ secrets.API_FOOTBALL_KEY }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: |
          python3 << 'PY'
          import os,requests
          KEY=os.environ.get('API_FOOTBALL_KEY',''); 
          print(f"Key exists: {bool(KEY)} len={len(KEY)} starts={KEY[:6]}...")
          hdr={"x-apisports-key":KEY}
          # Test key
          r=requests.get("https://v3.football.api-sports.io/status",headers=hdr).json()
          print("STATUS:", r)
          # Try today
          from datetime import datetime,timezone,timedelta
          today=(datetime.now(timezone.utc)+timedelta(hours=3)).strftime('%Y-%m-%d')
          print(f"Trying date {today}")
          fx=requests.get(f"https://v3.football.api-sports.io/fixtures?date={today}",headers=hdr).json()
          print("FIXTURES RAW:", str(fx)[:800])
          print(f"Found {len(fx.get('response',[]))} games")
          PY
